services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: code-scanner
      POSTGRES_PASSWORD: code-scanner
      POSTGRES_DB: code-scanner
    ports:
      - "5433:5432"
    volumes:
      - code_scanner_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code-scanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://code-scanner:code-scanner@postgres:5432/code-scanner
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts

  ui:
    build: ./ui
    ports:
      - "5173:5173"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - ./ui/src:/app/src

volumes:
  code_scanner_pg:
  qdrant_data:
